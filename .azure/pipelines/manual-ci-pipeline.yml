# ============================================
# SDLC-POC Manual CI/CD Pipeline
# ============================================
# Project: WINGS-POC
# Repository: SDLC-POC
# Organization: HOLMES-APPS
# ============================================
# COST CONTROL:
#   - trigger: none (NO auto-run on push)
#   - pr: none (NO auto-run on PR)
#   - Manual trigger ONLY via Azure DevOps Portal
#   - Uses FREE Microsoft-hosted agents (1800 min/month)
#   - After 1800 min: pipelines QUEUE (not charged)
#
# HOW TO RUN:
#   1. Go to: https://dev.azure.com/HOLMES-APPS/WINGS-POC/_build
#   2. Select this pipeline
#   3. Click "Run pipeline"
#   4. Select branch and click "Run"
#
# TO ENABLE AUTO-TRIGGER FOR DEMOS:
#   Uncomment the trigger/pr sections below
# ============================================

# ==================== MANUAL TRIGGER ONLY ====================
trigger: none      # No auto-run on code push
pr: none           # No auto-run on pull request

# ==================== UNCOMMENT FOR DEMO (AUTO-TRIGGER) ====================
# trigger:
#   branches:
#     include:
#       - main
#       - develop
#   paths:
#     exclude:
#       - docs/*
#       - '*.md'
#
# pr:
#   branches:
#     include:
#       - main
#       - develop

# ==================== VARIABLES ====================
variables:
  JAVA_VERSION: '17'
  NODE_VERSION: '18'
  MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository
  MAVEN_OPTS: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'

# ==================== STAGES ====================
stages:

# ==================== STAGE 1: BUILD & TEST ====================
- stage: Build
  displayName: 'Build & Test'
  jobs:
  
  # ---------- Backend Build ----------
  - job: BackendBuild
    displayName: 'Backend - Build & Test'
    pool:
      vmImage: 'ubuntu-latest'    # FREE Microsoft-hosted agent
    
    steps:
    - checkout: self
      displayName: 'Checkout Code'

    - task: Cache@2
      displayName: 'Cache Maven packages'
      inputs:
        key: 'maven | "$(Agent.OS)" | backend/pom.xml'
        restoreKeys: |
          maven | "$(Agent.OS)"
        path: $(MAVEN_CACHE_FOLDER)

    - task: JavaToolInstaller@0
      displayName: 'Install JDK $(JAVA_VERSION)'
      inputs:
        versionSpec: '$(JAVA_VERSION)'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    - task: Maven@4
      displayName: 'Maven Build'
      inputs:
        mavenPomFile: 'backend/pom.xml'
        goals: 'clean compile'
        options: '-DskipTests -B $(MAVEN_OPTS)'
        publishJUnitResults: false

    - task: Maven@4
      displayName: 'Run Unit Tests'
      inputs:
        mavenPomFile: 'backend/pom.xml'
        goals: 'test'
        options: '-B $(MAVEN_OPTS)'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        testRunTitle: 'Backend Unit Tests'
      continueOnError: true

    - task: Maven@4
      displayName: 'Package Application'
      inputs:
        mavenPomFile: 'backend/pom.xml'
        goals: 'package'
        options: '-DskipTests -B $(MAVEN_OPTS)'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Backend Artifacts'
      inputs:
        PathtoPublish: '$(System.DefaultWorkingDirectory)/backend'
        ArtifactName: 'backend-artifacts'
        publishLocation: 'Container'

  # ---------- Frontend Build ----------
  - job: FrontendBuild
    displayName: 'Frontend - Build & Test'
    pool:
      vmImage: 'ubuntu-latest'    # FREE Microsoft-hosted agent

    steps:
    - checkout: self
      displayName: 'Checkout Code'

    - task: NodeTool@0
      displayName: 'Install Node.js $(NODE_VERSION)'
      inputs:
        versionSpec: '$(NODE_VERSION)'

    - task: Cache@2
      displayName: 'Cache npm packages'
      inputs:
        key: 'npm | "$(Agent.OS)" | frontend/package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
        path: '$(System.DefaultWorkingDirectory)/frontend/node_modules'

    - script: |
        cd frontend
        npm ci
      displayName: 'Install Dependencies'

    - script: |
        cd frontend
        npm run lint || true
      displayName: 'Run Linting'
      continueOnError: true

    - script: |
        cd frontend
        npm run build:web
      displayName: 'Build Frontend'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Frontend Artifacts'
      inputs:
        PathtoPublish: '$(System.DefaultWorkingDirectory)/frontend/dist'
        ArtifactName: 'frontend-artifacts'
        publishLocation: 'Container'

# ==================== STAGE 2: CODE QUALITY ====================
- stage: CodeQuality
  displayName: 'Code Quality'
  dependsOn: Build
  condition: succeeded()
  jobs:
  
  - job: SecurityScan
    displayName: 'Security Scan (OWASP)'
    pool:
      vmImage: 'ubuntu-latest'    # FREE Microsoft-hosted agent
    
    steps:
    - checkout: self

    - task: JavaToolInstaller@0
      inputs:
        versionSpec: '17'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    - task: Maven@4
      displayName: 'OWASP Dependency Check'
      inputs:
        mavenPomFile: 'backend/pom.xml'
        goals: 'org.owasp:dependency-check-maven:check'
        options: '-DfailBuildOnCVSS=9 -B'
      continueOnError: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Security Report'
      inputs:
        PathtoPublish: '$(System.DefaultWorkingDirectory)/backend/target'
        ArtifactName: 'security-reports'
      condition: always()

# ==================== STAGE 3: LINEAJE SECURITY (Placeholder) ====================
# NOTE: SBOM generation is handled by Lineaje via Git integration
# Lineaje automatically scans when code is pushed to the repository
# 
# To view results: https://app.veedna.com → Projects → _git-SDLC-POC-test
#
# This stage is a placeholder for future Lineaje API integration
# when service connection / agent issues are resolved
# ============================================

# ==================== PIPELINE SUMMARY ====================
# 
# Stages:
#   1. Build & Test (Backend + Frontend in parallel)
#   2. Code Quality (OWASP Security Scan)
#
# SBOM/Security: Handled by Lineaje Git integration (external)
#   - Lineaje scans repository automatically
#   - View results at: https://app.veedna.com
#
# Estimated run time: 6-10 minutes
# Monthly demos possible: ~180-300 (within 1800 min free tier)
#
# ============================================
