# ============================================
#
# Step 1: Create SBOM in Lineaje Portal (ONE-TIME SETUP)
#   - Go to: https://app.veedna.com
#   - Integrations → Scan Remotely → Git
#   - Add Azure DevOps repo: https://dev.azure.com/HOLMES-APPS/WINGS-POC/_git/SDLC-POC
#   - Lineaje generates SBOM automatically
#
# Step 2: View Vulnerabilities
#   - Go to: https://app.veedna.com → Projects → _git-SDLC-POC-test
