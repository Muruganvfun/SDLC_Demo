# ============================================
# OMS CI Pipeline - Continuous Integration
# For: Pull Request validation and branch builds
# ============================================

trigger:
  branches:
    include:
      - develop
      - feature/*
      - bugfix/*
  paths:
    exclude:
      - docs/*
      - '*.md'

pr:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  JAVA_VERSION: '17'
  NODE_VERSION: '18'
  MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository
  MAVEN_OPTS: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'

stages:
- stage: CI
  displayName: 'Continuous Integration'
  jobs:
  
  # ========== Backend CI ==========
  - job: BackendCI
    displayName: 'Backend - Build & Test'
    services:
      postgres:
        image: postgres:15-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
    
    steps:
    - task: Cache@2
      displayName: 'Cache Maven'
      inputs:
        key: 'maven | "$(Agent.OS)" | backend/pom.xml'
        restoreKeys: maven | "$(Agent.OS)"
        path: $(MAVEN_CACHE_FOLDER)

    - task: JavaToolInstaller@0
      displayName: 'Setup JDK $(JAVA_VERSION)'
      inputs:
        versionSpec: '$(JAVA_VERSION)'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    - script: |
        cd backend
        mvn clean compile -DskipTests -B $(MAVEN_OPTS)
      displayName: 'Compile Backend'

    - script: |
        cd backend
        mvn test -B $(MAVEN_OPTS)
      displayName: 'Run Unit Tests'

    - task: PublishTestResults@2
      displayName: 'Publish Test Results'
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        searchFolder: '$(System.DefaultWorkingDirectory)/backend'
        testRunTitle: 'Backend Unit Tests'
      condition: always()

    - script: |
        cd backend
        mvn jacoco:report -B $(MAVEN_OPTS)
      displayName: 'Generate Coverage Report'

    - task: PublishCodeCoverageResults@2
      displayName: 'Publish Coverage'
      inputs:
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/backend/**/target/site/jacoco/jacoco.xml'

    - script: |
        cd backend
        mvn package -DskipTests -B $(MAVEN_OPTS)
      displayName: 'Package Application'

  # ========== Frontend CI ==========
  - job: FrontendCI
    displayName: 'Frontend - Build & Test'
    
    steps:
    - task: NodeTool@0
      displayName: 'Setup Node.js $(NODE_VERSION)'
      inputs:
        versionSpec: '$(NODE_VERSION)'

    - task: Cache@2
      displayName: 'Cache npm'
      inputs:
        key: 'npm | "$(Agent.OS)" | frontend/package-lock.json'
        path: 'frontend/node_modules'

    - script: |
        cd frontend
        npm ci
      displayName: 'Install Dependencies'

    - script: |
        cd frontend
        npm run lint || true
      displayName: 'Lint Code'
      continueOnError: true

    - script: |
        cd frontend
        npm run test:ci
      displayName: 'Run Tests'

    - task: PublishTestResults@2
      displayName: 'Publish Test Results'
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'frontend/junit.xml'
        testRunTitle: 'Frontend Unit Tests'
      condition: always()

    - task: PublishCodeCoverageResults@2
      displayName: 'Publish Coverage'
      inputs:
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/frontend/coverage/lcov.info'
      condition: always()

    - script: |
        cd frontend
        npm run build:web
      displayName: 'Build Frontend'

  # ========== Code Quality Gate ==========
  - job: QualityGate
    displayName: 'Quality Gate Check'
    dependsOn:
      - BackendCI
      - FrontendCI
    condition: succeeded()
    
    steps:
    - script: |
        echo "=========================================="
        echo "  All quality checks passed!"
        echo "  - Backend build: SUCCESS"
        echo "  - Backend tests: SUCCESS"
        echo "  - Frontend build: SUCCESS"
        echo "  - Frontend tests: SUCCESS"
        echo "=========================================="
      displayName: 'Quality Gate Summary'
