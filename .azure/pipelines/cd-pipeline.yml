# ============================================
# OMS CD Pipeline - Continuous Deployment
# Multi-environment deployment: Dev -> QA -> Production
# ============================================

trigger: none  # Triggered by CI pipeline or manually

resources:
  pipelines:
    - pipeline: CI
      source: 'OMS-CI-Pipeline'
      trigger:
        branches:
          include:
            - main
            - develop

parameters:
  - name: environment
    displayName: 'Target Environment'
    type: string
    default: 'dev'
    values:
      - dev
      - qa
      - production

  - name: services
    displayName: 'Services to Deploy'
    type: object
    default:
      - api-gateway
      - auth-service
      - catalog-service
      - order-service
      - inventory-service
      - payment-service
      - shipping-service
      - notification-service
      - frontend

variables:
  azureSubscription: 'SDLC-POC-ServiceConnection'
  acrName: 'sdlcpocacr'
  resourceGroup: 'SDLC-POC-RG'
  aksCluster: 'oms-aks-cluster'

stages:
# ==================== DEPLOY TO DEVELOPMENT ====================
- stage: DeployDev
  displayName: 'Deploy to Development'
  condition: or(eq('${{ parameters.environment }}', 'dev'), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
  variables:
    env: 'dev'
    namespace: 'oms-dev'
  jobs:
  - deployment: DeployDev
    displayName: 'Deploy to Dev'
    pool:
      vmImage: 'ubuntu-latest'
    environment: 'OMS-Development'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          
          - task: AzureCLI@2
            displayName: 'Deploy Services to Dev'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "=========================================="
                echo "Deploying to DEVELOPMENT environment"
                echo "=========================================="
                
                # Option 1: Deploy to Azure Container Apps
                # for service in api-gateway auth-service catalog-service order-service inventory-service payment-service shipping-service notification-service frontend; do
                #   echo "Deploying $service..."
                #   az containerapp update \
                #     --name oms-$service-dev \
                #     --resource-group $(resourceGroup) \
                #     --image $(acrName).azurecr.io/oms/$service:$(Build.BuildId)
                # done
                
                # Option 2: Deploy to AKS
                # az aks get-credentials --resource-group $(resourceGroup) --name $(aksCluster)
                # kubectl apply -f k8s/dev/ -n $(namespace)
                
                echo "Development deployment completed!"

          - script: |
              echo "Running smoke tests on Dev..."
              # curl -f http://oms-dev.azurewebsites.net/actuator/health || exit 1
              echo "Smoke tests passed!"
            displayName: 'Smoke Tests'

# ==================== DEPLOY TO QA ====================
- stage: DeployQA
  displayName: 'Deploy to QA'
  dependsOn: DeployDev
  condition: and(succeeded(), or(eq('${{ parameters.environment }}', 'qa'), eq('${{ parameters.environment }}', 'production')))
  variables:
    env: 'qa'
    namespace: 'oms-qa'
  jobs:
  - deployment: DeployQA
    displayName: 'Deploy to QA'
    pool:
      vmImage: 'ubuntu-latest'
    environment: 'OMS-QA'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          
          - task: AzureCLI@2
            displayName: 'Deploy Services to QA'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "=========================================="
                echo "Deploying to QA environment"
                echo "=========================================="
                echo "QA deployment completed!"

  - job: IntegrationTests
    displayName: 'Run Integration Tests'
    dependsOn: DeployQA
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - script: |
        echo "Running integration tests against QA..."
        # npm run test:e2e -- --baseUrl=http://oms-qa.azurewebsites.net
        echo "Integration tests completed!"
      displayName: 'Integration Tests'

  - job: PerformanceTests
    displayName: 'Run Performance Tests'
    dependsOn: DeployQA
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - script: |
        echo "Running performance tests..."
        # k6 run performance-tests/load-test.js
        echo "Performance tests completed!"
      displayName: 'Performance Tests'

# ==================== DEPLOY TO PRODUCTION ====================
- stage: DeployProduction
  displayName: 'Deploy to Production'
  dependsOn: DeployQA
  condition: and(succeeded(), eq('${{ parameters.environment }}', 'production'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  variables:
    env: 'production'
    namespace: 'oms-prod'
  jobs:
  - deployment: DeployProduction
    displayName: 'Deploy to Production'
    pool:
      vmImage: 'ubuntu-latest'
    environment: 'OMS-Production'
    strategy:
      runOnce:
        preDeploy:
          steps:
          - script: |
              echo "=========================================="
              echo "PRE-DEPLOYMENT CHECKS"
              echo "=========================================="
              echo "1. Verifying all QA tests passed..."
              echo "2. Checking deployment window..."
              echo "3. Notifying stakeholders..."
              echo "Pre-deployment checks completed!"
            displayName: 'Pre-deployment Checks'

        deploy:
          steps:
          - checkout: self
          
          - task: AzureCLI@2
            displayName: 'Blue-Green Deployment'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "=========================================="
                echo "PRODUCTION DEPLOYMENT - Blue-Green"
                echo "=========================================="
                
                # Step 1: Deploy to Green (staging) slot
                echo "Step 1: Deploying to staging slot..."
                
                # Step 2: Run health checks on staging
                echo "Step 2: Running health checks..."
                
                # Step 3: Swap slots
                echo "Step 3: Swapping slots..."
                
                echo "Production deployment completed!"

        postRouteTraffic:
          steps:
          - script: |
              echo "Verifying production health..."
              # curl -f http://oms.azurewebsites.net/actuator/health
              echo "Production is healthy!"
            displayName: 'Post-deployment Verification'

        on:
          failure:
            steps:
            - script: |
                echo "=========================================="
                echo "DEPLOYMENT FAILED - INITIATING ROLLBACK"
                echo "=========================================="
                # Rollback commands
                echo "Rollback completed!"
              displayName: 'Rollback on Failure'

          success:
            steps:
            - script: |
                echo "=========================================="
                echo "DEPLOYMENT SUCCESSFUL"
                echo "=========================================="
                echo "Sending notifications..."
                echo "Updating deployment records..."
              displayName: 'Post-deployment Tasks'
