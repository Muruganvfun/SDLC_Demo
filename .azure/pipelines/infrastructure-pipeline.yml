# ============================================
# OMS Infrastructure Pipeline
# Provisions Azure resources using ARM/Bicep/Terraform
# ============================================

trigger: none

parameters:
  - name: environment
    displayName: 'Environment'
    type: string
    default: 'dev'
    values:
      - dev
      - qa
      - production

  - name: action
    displayName: 'Action'
    type: string
    default: 'plan'
    values:
      - plan
      - apply
      - destroy

variables:
  azureSubscription: 'WINGS-POC-ServiceConnection'
  resourceGroup: 'WINGS-POC-${{ parameters.environment }}-RG'
  location: 'eastus'

stages:
- stage: Infrastructure
  displayName: 'Provision Infrastructure'
  jobs:
  - job: ProvisionResources
    displayName: 'Provision Azure Resources'
    pool:
      vmImage: 'ubuntu-latest'
    
    steps:
    - task: AzureCLI@2
      displayName: 'Create Resource Group'
      condition: eq('${{ parameters.action }}', 'apply')
      inputs:
        azureSubscription: '$(azureSubscription)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az group create --name $(resourceGroup) --location $(location)

    - task: AzureCLI@2
      displayName: 'Create Azure Container Registry'
      condition: eq('${{ parameters.action }}', 'apply')
      inputs:
        azureSubscription: '$(azureSubscription)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az acr create \
            --resource-group $(resourceGroup) \
            --name wingspocacr${{ parameters.environment }} \
            --sku Basic \
            --admin-enabled true

    - task: AzureCLI@2
      displayName: 'Create PostgreSQL Servers'
      condition: eq('${{ parameters.action }}', 'apply')
      inputs:
        azureSubscription: '$(azureSubscription)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          # Create PostgreSQL Flexible Server
          az postgres flexible-server create \
            --resource-group $(resourceGroup) \
            --name oms-postgres-${{ parameters.environment }} \
            --location $(location) \
            --admin-user omsadmin \
            --admin-password '$(POSTGRES_PASSWORD)' \
            --sku-name Standard_B1ms \
            --tier Burstable \
            --storage-size 32 \
            --version 15

    - task: AzureCLI@2
      displayName: 'Create Azure Container Apps Environment'
      condition: eq('${{ parameters.action }}', 'apply')
      inputs:
        azureSubscription: '$(azureSubscription)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          # Create Container Apps Environment
          az containerapp env create \
            --resource-group $(resourceGroup) \
            --name oms-env-${{ parameters.environment }} \
            --location $(location)

    - task: AzureCLI@2
      displayName: 'Output Infrastructure Details'
      inputs:
        azureSubscription: '$(azureSubscription)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "=========================================="
          echo "Infrastructure Provisioned for ${{ parameters.environment }}"
          echo "=========================================="
          echo "Resource Group: $(resourceGroup)"
          echo "Location: $(location)"
          echo "ACR: wingspocacr${{ parameters.environment }}.azurecr.io"
          echo "=========================================="
