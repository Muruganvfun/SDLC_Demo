apiVersion: v1
kind: ConfigMap
metadata:
  name: oms-config
  namespace: oms-dev
data:
  SPRING_PROFILES_ACTIVE: "kubernetes"
  
  # Service URLs (internal K8s DNS)
  AUTH_SERVICE_URL: "http://auth-service:8081"
  CATALOG_SERVICE_URL: "http://catalog-service:8082"
  ORDER_SERVICE_URL: "http://order-service:8083"
  INVENTORY_SERVICE_URL: "http://inventory-service:8084"
  PAYMENT_SERVICE_URL: "http://payment-service:8085"
  SHIPPING_SERVICE_URL: "http://shipping-service:8086"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8087"
  
  # Database Configuration (use secrets for credentials)
  AUTH_DB_HOST: "oms-postgres-dev.postgres.database.azure.com"
  CATALOG_DB_HOST: "oms-postgres-dev.postgres.database.azure.com"
  ORDER_DB_HOST: "oms-postgres-dev.postgres.database.azure.com"
  INVENTORY_DB_HOST: "oms-postgres-dev.postgres.database.azure.com"
  PAYMENT_DB_HOST: "oms-postgres-dev.postgres.database.azure.com"
  SHIPPING_DB_HOST: "oms-postgres-dev.postgres.database.azure.com"
