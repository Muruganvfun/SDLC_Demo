# ============================================
# OMS Microservices Kubernetes Deployments
# ============================================

# ---------- Auth Service ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: oms-dev
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: sdlcpocacr.azurecr.io/oms/auth-service:latest
        ports:
        - containerPort: 8081
        envFrom:
        - configMapRef:
            name: oms-config
        - secretRef:
            name: oms-secrets
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://$(AUTH_DB_HOST):5432/authdb"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: oms-dev
spec:
  ports:
  - port: 8081
    targetPort: 8081
  selector:
    app: auth-service

