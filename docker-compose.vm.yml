version: '3.8'

# ============================================
# OMS SDLC - VM Deployment Configuration
# ============================================
# Frontend: Served by main nginx from /var/www/html/oms-sdlc/
# Backend: Docker Compose (14 containers)
# External Port: 8090 (API Gateway)
# ============================================

services:
  # ==================== DATABASES (6) ====================
  
  auth-db:
    image: postgres:15-alpine
    container_name: oms-auth-db
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - oms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  catalog-db:
    image: postgres:15-alpine
    container_name: oms-catalog-db
    environment:
      POSTGRES_DB: catalogdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    networks:
      - oms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-db:
    image: postgres:15-alpine
    container_name: oms-order-db
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - order-db-data:/var/lib/postgresql/data
    networks:
      - oms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  inventory-db:
    image: postgres:15-alpine
    container_name: oms-inventory-db
    environment:
      POSTGRES_DB: inventorydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    networks:
      - oms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-db:
    image: postgres:15-alpine
    container_name: oms-payment-db
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    networks:
      - oms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  shipping-db:
    image: postgres:15-alpine
    container_name: oms-shipping-db
    environment:
      POSTGRES_DB: shippingdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - shipping-db-data:/var/lib/postgresql/data
    networks:
      - oms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== MICROSERVICES (8) ====================

  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    container_name: oms-auth-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:-OMS_JWT_SECRET_KEY_MINIMUM_256_BITS_FOR_HS256_ALGORITHM_SECURITY}
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - oms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  catalog-service:
    build:
      context: ./backend
      dockerfile: catalog-service/Dockerfile
    container_name: oms-catalog-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      catalog-db:
        condition: service_healthy
    networks:
      - oms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  order-service:
    build:
      context: ./backend
      dockerfile: order-service/Dockerfile
    container_name: oms-order-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      order-db:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    networks:
      - oms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  inventory-service:
    build:
      context: ./backend
      dockerfile: inventory-service/Dockerfile
    container_name: oms-inventory-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      inventory-db:
        condition: service_healthy
    networks:
      - oms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  payment-service:
    build:
      context: ./backend
      dockerfile: payment-service/Dockerfile
    container_name: oms-payment-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      payment-db:
        condition: service_healthy
    networks:
      - oms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  shipping-service:
    build:
      context: ./backend
      dockerfile: shipping-service/Dockerfile
    container_name: oms-shipping-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      shipping-db:
        condition: service_healthy
    networks:
      - oms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  notification-service:
    build:
      context: ./backend
      dockerfile: notification-service/Dockerfile
    container_name: oms-notification-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - oms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==================== API GATEWAY ====================

  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: oms-api-gateway
    ports:
      - "8090:8080"    # External port 8090 to avoid conflicts
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:-OMS_JWT_SECRET_KEY_MINIMUM_256_BITS_FOR_HS256_ALGORITHM_SECURITY}
      CORS_ALLOWED_ORIGINS: "https://wingsdemo.waip.wiprocms.com,http://localhost:3000,http://localhost:19006"
    depends_on:
      - auth-service
      - catalog-service
      - order-service
      - inventory-service
      - payment-service
      - shipping-service
      - notification-service
    networks:
      - oms-network
    restart: unless-stopped

# ==================== VOLUMES ====================

volumes:
  auth-db-data:
  catalog-db-data:
  order-db-data:
  inventory-db-data:
  payment-db-data:
  shipping-db-data:

# ==================== NETWORKS ====================

networks:
  oms-network:
    driver: bridge
