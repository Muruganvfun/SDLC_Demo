# SonarQube Project Configuration
# ================================

# Project identification
sonar.projectKey=oms-order-management-system
sonar.projectName=Order Management System
sonar.projectVersion=1.0.0-SNAPSHOT

# Source code location
sonar.sources=auth-service/src/main/java,catalog-service/src/main/java,order-service/src/main/java,inventory-service/src/main/java,payment-service/src/main/java,shipping-service/src/main/java,notification-service/src/main/java,api-gateway/src/main/java,common/src/main/java

# Test code location
sonar.tests=auth-service/src/test/java,catalog-service/src/test/java,order-service/src/test/java,inventory-service/src/test/java

# Java configuration
sonar.java.source=17
sonar.sourceEncoding=UTF-8

# JaCoCo coverage reports
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml

# Exclusions from analysis
sonar.exclusions=**/config/**,**/dto/**,**/entity/**,**/*Application.java,**/target/**

# Duplicate code detection exclusions
sonar.cpd.exclusions=**/dto/**,**/entity/**

# Test exclusions from coverage
sonar.coverage.exclusions=**/config/**,**/dto/**,**/entity/**,**/*Application.java

# Quality gate settings
sonar.qualitygate.wait=true

# Issue exclusions
sonar.issue.ignore.multicriteria=e1,e2

# Ignore "Add a private constructor" for utility classes
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S1118
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*Application.java

# Ignore "Make this field final" for Spring beans
sonar.issue.ignore.multicriteria.e2.ruleKey=java:S3077
sonar.issue.ignore.multicriteria.e2.resourceKey=**/service/**
